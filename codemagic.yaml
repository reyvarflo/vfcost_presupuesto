workflows:
  ios-release:
    name: VF COST Pro - iOS (iPhone) Release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Obtener dependencias de Flutter
        script: flutter pub get

      - name: Ejecutar tests automáticos
        script: flutter test

      - name: Compilar binario nativo iOS
        script: |
          flutter build ios --release --no-codesign

      - name: Empaquetar como archivo .IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 VFCOST_Pro_iOS.ipa Payload

    artifacts:
      - VFCOST_Pro_iOS.ipa
      - build/ios/iphoneos/Runner.app
